spring.application.name=supply-chain-intelligence
spring.application.version=1.0.0

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://postgres:5432/supply_chain
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# PostgreSQL specific settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# CSV Data Loader Configuration
# Set to true to load CSV data on application startup
app.data.load-csv-on-startup=${LOAD_CSV_ON_STARTUP:false}
# Path to the curated CSV file (relative to working directory)
app.data.csv-path=${CSV_PATH:curated/shipments_curated.csv}
# Skip loading if data already exists in database
app.data.skip-if-data-exists=${SKIP_IF_DATA_EXISTS:true}

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://ml-service:5000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
info.app.name=Supply Chain Intelligence Platform
info.app.version=1.0.0
info.app.description=Supply chain intelligence mini-platform with delay prediction and route analytics
info.app.database=PostgreSQL

# Logging
logging.level.root=INFO
logging.level.com.supply_chain_intelligence=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n