# H2 Test Configuration Profile (for unit/integration tests)
spring.application.name=supply-chain-intelligence
spring.application.version=1.0.0

# H2 In-Memory Database (for testing only)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/

# Logging (quieter for tests)
logging.level.root=WARN
logging.level.com.supply_chain_intelligence=INFO
